<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
</head>

<body>

    <section class="login-section p-2">
        <!-- Left image section -->
        <div class="left-section">
            <div class="image-container bg-changepassword">
                <div class="text-overlay text-white text-center">
                    <h2 class="fw-bold">Restore Your Luxor Access</h2>
                    <p class="mb-0">Sign in to unlock exclusive stays and
                        unforgettable experiences.</p>
                </div>
            </div>
        </div>

        <!-- Right Form Section -->
        <div class="right-section">
            <div class="form-wrapper">
                <h3 class="fw-bold text-primary mb-2">Create Password</h3>
                <p class="text-muted mb-4">Please enter your details to access your account.</p>

                <form>
                    <!-- Password -->
                    <div class="mb-3 position-relative">
                        <input type="password" class="form-control py-2 ps-5 pe-5 password-field"
                            data-translate="password_placeholder" placeholder="Password" required>
                        <i
                            class="fa-solid fa-lock position-absolute top-50 start-0 translate-middle-y ps-3 text-secondary"></i>
                        <i
                            class="fa-solid fa-eye-slash position-absolute top-50 end-0 translate-middle-y pe-3 text-secondary toggle-password"></i>
                    </div>

                    <!-- Re-enter Password -->
                    <div class="mb-3 position-relative">
                        <input type="password" class="form-control py-2 ps-5 pe-5 password-field"
                            data-translate="password_placeholder" placeholder="Confirm Password" required>
                        <i
                            class="fa-solid fa-lock position-absolute top-50 start-0 translate-middle-y ps-3 text-secondary"></i>
                        <i
                            class="fa-solid fa-eye-slash position-absolute top-50 end-0 translate-middle-y pe-3 text-secondary toggle-password"></i>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill">Create</button>
                </form>

            </div>
        </div>

    </section>

    <script src="/assets/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/form.js"></script>

</body>

</html>
