<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
</head>

<body>

    <section class="login-section min-vh-100 d-flex align-items-center justify-content-center p-3">

        <div class="col-lg-4 col-md-6 col-sm-10">
            <div class="card border-0 shadow rounded-4">

                <div class="card-body p-4 p-lg-5">

                    <!-- Header -->
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <i class="fa-solid fa-key fa-2x text-primary"></i>
                        </div>
                        <h3 class="fw-bold mb-2">Create New Password</h3>
                        <p class="text-muted small mb-0">
                            Your new password must be different from previous ones.
                        </p>
                    </div>

                    <!-- Form -->
                    <form>

                        <!-- New Password -->
                        <div class="mb-3 position-relative">
                            <input type="password" name="new_password"
                                class="form-control form-control-lg ps-5 password-field" placeholder="New password"
                                required>
                            <i
                                class="fa-solid fa-lock position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">
                            </i>

                        </div>

                        <!-- Confirm Password -->
                        <div class="mb-3 position-relative">
                            <input type="password" name="password_confirmation"
                                class="form-control form-control-lg ps-5 password-field" placeholder="Confirm password"
                                required>
                            <i
                                class="fa-solid fa-lock position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">
                            </i>

                        </div>


                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-semibold">
                            Update Password
                        </button>

                    </form>

                </div>
            </div>
        </div>

    </section>


    <script src="/assets/js/bootstrap.bundle.min.js"></script>

</body>

</html>
