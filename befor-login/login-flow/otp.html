<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookLuxor otp</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/main.css" />
    <link rel="stylesheet" href="../../assets/css/style.css" />
</head>

<body>
    <section class="login-section min-vh-100 d-flex align-items-center justify-content-center p-3">

        <div class="col-lg-4 col-md-6 col-sm-10">
            <div class="card border-0 shadow rounded-4">

                <div class="card-body p-4 p-lg-5">

                    <!-- Header -->
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <i class="fa-solid fa-shield-halved fa-2x text-primary"></i>
                        </div>
                        <h3 class="fw-bold mb-2">Verify OTP</h3>
                        <p class="text-muted small mb-0">
                            Enter the 4-digit code sent to your email
                        </p>
                    </div>

                    <!-- OTP Form -->
                    <form class="otp-form">

                        <div class="d-flex justify-content-center gap-3 mb-3">
                            <input type="text" name="otp1" maxlength="1" class="form-control otp-box text-center"
                                required>
                            <input type="text" name="otp2" maxlength="1" class="form-control otp-box text-center"
                                required>
                            <input type="text" name="otp3" maxlength="1" class="form-control otp-box text-center"
                                required>
                            <input type="text" name="otp4" maxlength="1" class="form-control otp-box text-center"
                                required>
                        </div>

                        <div class="text-center mb-4">
                            <span class="text-muted small">
                                Didn’t receive the code?
                            </span>
                            <a href="#" class="fw-semibold text-primary text-decoration-none ms-1">
                                Resend OTP
                            </a>
                        </div>

                        <a href="/befor-login/login-flow/changepw.html" type="submit"
                            class="btn btn-primary w-100 py-2 rounded-pill fw-semibold">
                            Verify & Continue
                        </a>

                    </form>

                </div>
            </div>
        </div>

    </section>


    <script src="/assets/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/form.js"></script>




</body>

</html>
