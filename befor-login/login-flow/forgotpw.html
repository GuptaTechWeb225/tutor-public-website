<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-translate="forgot_page_title">Forgot Password</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/main.css" />
  <link rel="stylesheet" href="../../assets/css/style.css" />
</head>

<body>
  <section class="login-section p-2">
    <!-- Left image section -->
    <div class="left-section">
      <div class="image-container bg-forgot">
        <div class="text-overlay text-white text-center">
          <h2 class="fw-bold" data-translate="forgotpw-left_title">Restore Your Luxor
            Access</h2>
          <p class="mb-0" data-translate="left_subtitle">
            Sign in to unlock exclusive stays and
            unforgettable experiences.
          </p>
        </div>
      </div>
    </div>

    <!-- Right Form Section -->
    <div class="right-section">
      <div class="form-wrapper">
        <h3 class="fw-bold text-primary mb-2" data-translate="forgot_title">Forgot Password</h3>
        <p class="text-muted mb-4" data-translate="forgot_subtitle">Please enter your registered email.</p>
        <form>
          <div class="mb-3 position-relative">
            <input type="email" class="form-control py-2 p-5" data-translate="forgotpw-email_placeholder"
              placeholder="Email address" required>
            <i
              class="fa-regular fa-envelope position-absolute top-50 start-0 translate-middle-y ps-3 text-secondary"></i>
          </div>

          <a href="otp.html" type="submit" class="btn btn-primary w-100 py-2 rounded-pill" data-translate="forgot_button">Send</a>
        </form>
      </div>
    </div>
  </section>

  <script src="../../assets/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/lang.js"></script>
</body>

</html>
