<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/assets/images/fav.png">
    <title data-translate="login_page_title">Student Login</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
</head>

<body>
<div class="container">
    <div class="row min-vh-100 d-flex justify-content-center align-items-center">

        <div class="col-lg-6 col-md-8 col-sm-10">

            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="p-4 p-lg-5">

                    <!-- HEADER -->
                    <div class="mb-4 text-center">
                        <h3 class="fw-bold mb-2">Welcome back, Tutor</h3>
                        <p class="text-muted mb-1">
                            Log in to manage your students, sessions, and earnings.
                        </p>
                        <small class="text-muted">
                            New here?
                            <a href="/befor-login/login-flow/tutor-signup.html"
                               class="fw-semibold text-primary text-decoration-none">
                                Apply to become a tutor
                            </a>
                        </small>
                    </div>

                    <!-- SOCIAL LOGIN -->
                    <div class="row g-2 mb-4">
                        <div class="col">
                            <button class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center gap-2">
                                <img src="/assets/images/svg/google.svg" width="16">
                                Google
                            </button>
                        </div>
                        <div class="col">
                            <button class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center gap-2">
                                <img src="/assets/images/svg/apple.svg" width="16">
                                Apple
                            </button>
                        </div>
                        <div class="col">
                            <button class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center gap-2">
                                <img src="/assets/images/svg/facebook.svg" width="16">
                                Facebook
                            </button>
                        </div>
                    </div>

                    <div class="text-center my-4">
                        <small class="text-muted">
                            or sign in with your tutor credentials
                        </small>
                    </div>

                    <!-- FORM -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Email address
                        </label>
                        <input type="email"
                               class="form-control form-control-lg"
                               placeholder="tutor@example.com"
                               required>
                    </div>

                    <div class="mb-2">
                        <label class="form-label fw-semibold">
                            Password
                        </label>
                        <input type="password"
                               class="form-control form-control-lg"
                               placeholder="Enter your password"
                               required>
                    </div>

                    <!-- HELP LINKS -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label small" for="rememberMe">
                                Remember me
                            </label>
                        </div>
                        <a href="/befor-login/login-flow/forgotpw.html"
                           class="small text-decoration-none">
                            Forgot password?
                        </a>
                    </div>

                    <!-- CTA -->
                    <a href="/tutor-flow-after-login/tutor-question-signup.html"
                       class="btn btn-primary w-100 py-2 rounded-3 fw-semibold">
                        Go to Tutor Dashboard →
                    </a>

                    <!-- FOOTER -->
                    <div class="text-center mt-4">
                        <small class="text-muted">
                            Looking for a tutor?
                            <a href="/befor-login/login-flow/login.html"
                               class="fw-semibold text-primary text-decoration-none">
                                Student Login
                            </a>
                        </small>
                    </div>

                </div>
            </div>

        </div>

    </div>
</div>


    <script src="/assets/js/bootstrap.bundle.min.js"></script>
</body>

</html>
