<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="signup_page_title">BookLuxor Login</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
</head>

<body>
    <div class="container">
        <div class="row min-vh-100 align-items-center justify-content-center">

            <div class="col-lg-7 col-md-9 col-sm-11">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">

                    <div class="p-5">

                        <!-- HEADER -->
                        <div class="text-center ">
                            <h3 class="fw-bold ">Start learning smarter</h3>
                            <p class="text-muted">
                                Join thousands of students learning directly from verified experts.
                            </p>
                        </div>
                        <!-- FOOTER -->
                        <div class="text-center mb-3">
                            <small class="text-muted ">
                                Already a student?
                                <a href="/befor-login/login-flow/login.html"
                                    class="fw-semibold text-decoration-none">Sign in</a>
                            </small>
                        </div>
                        <!-- SOCIAL -->
                        <div class="row g-2 mb-3">
                            <div class="col-md-4">
                                <button
                                    class="btn btn-outline-dark w-100 d-flex align-items-center justify-content-center gap-2">
                                    <img src="/assets/images/svg/google.svg" width="16">
                                    <span>Google</span>
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button
                                    class="btn btn-outline-dark w-100 d-flex align-items-center justify-content-center gap-2">
                                    <img src="/assets/images/svg/apple.svg" width="16">
                                    <span>Apple</span>
                                </button>
                            </div>
                            <div class="col-md-4">
                                <button
                                    class="btn btn-outline-dark w-100 d-flex align-items-center justify-content-center gap-2">
                                    <img src="/assets/images/svg/facebook.svg" width="16">
                                    <span>Facebook</span>
                                </button>
                            </div>
                        </div>

                        <div class="text-center my-3">
                            <small class="text-muted">or sign up with your email</small>
                        </div>

                        <!-- FORM -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First name</label>
                                <input type="text" name="first_name" class="form-control form-control-lg"
                                    placeholder="Rahul" required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last name</label>
                                <input type="text" name="last_name" class="form-control form-control-lg"
                                    placeholder="Sharma" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email address</label>
                            <input type="email" name="email" class="form-control form-control-lg"
                                placeholder="student@email.com" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" name="password" class="form-control form-control-lg"
                                    placeholder="••••••••" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Confirm password</label>
                                <input type="password" name="password_confirmation" class="form-control form-control-lg"
                                    placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" name="agree_terms" id="agree" required>
                            <label class="form-check-label small" for="agree">
                                I agree to the <a href="/FAQ/term-condition.html">Terms</a> & <a
                                    href="/FAQ/privacy.html">Privacy Policy</a>
                            </label>
                        </div>

                        <!-- CTA -->
                        <button type="submit" class="btn btn-primary btn-sm w-100 rounded-3">
                            Create my student account →
                        </button>

                        <!-- FOOTER -->
                        <div class="text-center mt-4">
                            <small class="text-muted">
                                Want to become a tutor?
                                <a href="/tutor/signup" class="fw-semibold text-decoration-none">Sign up</a>
                            </small>
                        </div>


                    </div>

                </div>
            </div>

        </div>
    </div>


    <script src="/assets/js/bootstrap.bundle.min.js"></script>

</body>

</html>
