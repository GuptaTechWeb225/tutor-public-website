<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="signup_page_title">BookLuxor Login</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
</head>

<body>
    <section class="login-section p-2">
        <!-- Left Image Section -->
        <div class="left-section">
            <div class="image-container bg-register">
                <div class="text-overlay text-white text-center">
                    <h2 class="fw-bold" data-translate="signup_left_title">Step Into Luxor Luxury</h2>
                    <p class="mb-0" data-translate="signup_left_subtitle">
                        Create your account and start your Luxor adventure.
                    </p>
                </div>
            </div>
        </div>

        <!-- Right Form Section -->
        <div class="right-section pt-5">
            <div class="form-wrapper">
                <div class="d-flex justify-content-between">
                    <h3 class="fw-bold text-primary mb-2" data-translate="singup_title">Sign up</h3>

                    <div class="d-flex align-items-center mb-2">
                        <img src="/assets/images/form/english.png" alt="EN" width="20" height="20" />
                        <div class="dropdown">
                            <button class="btn p-1 btn-sm border-0 fw-semibold text-dark dropdown-toggle no-caret"
                                type="button" data-bs-toggle="dropdown">
                                EN
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item d-flex align-items-center" href="#"> <img
                                            src="/assets/images/form/english.png" alt="EN" width="18" height="18"
                                            class="me-2" />
                                        EN</a></li>
                                <li><a class="dropdown-item d-flex align-items-center" href="#"> <img
                                            src="/assets/images/form/ar.png" alt="AR" width="18" height="18"
                                            class="me-2" />
                                        AR</a></li>
                            </ul>
                        </div>
                    </div>
                </div>

                <p class="text-muted mb-4" data-translate="singup_subtitle">
                    Join our community and get access toexclusive features and content.
                </p>

                <form>
                    <div class="mb-3">
                        <label data-translate="label_first_name" for="firstName">First Name</label>
                        <input type="text" class="form-control py-2" id="firstName" style="border-color: #CFCBCD;"
                            data-translate="placeholder_first_name" placeholder="First Name" required>
                    </div>

                    <div class="mb-3">
                        <label data-translate="label_email" for="email">Email</label>
                        <input type="email" class="form-control py-2" id="email" style="border-color: #CFCBCD;"
                            data-translate="placeholder_email" placeholder="Email Address" required>
                    </div>

                    <div class="mb-3">
                        <label data-translate="label_phone" for="phone">Phone</label>
                        <input type="text" class="form-control py-2" style="border-color: #CFCBCD;" id="phone"
                            data-translate="placeholder_phone" placeholder="Enter Phone Number" required>
                    </div>

                    <div class="mb-3">
                        <label data-translate="label_phone" for="phone">Phone</label>
                        <input type="text" class="form-control py-2" style="border-color: #CFCBCD;" id="phone"
                            data-translate="placeholder_phone" placeholder="Enter Phone Number" required>
                    </div> 

                    <div class="mb-3">
                        <label data-translate="label_phone" for="phone">Phone</label>
                        <input type="text" class="form-control py-2" style="border-color: #CFCBCD;" id="phone"
                            data-translate="placeholder_phone" placeholder="Enter Phone Number" required>
                    </div>

                    <a href="/after-login/landing.html" type="submit" class="btn btn-primary w-100 py-2 rounded-pill"
                        data-translate="signup_button">Sign Up</a>
                </form>

                <div class="divider" data-translate="or_text">Or</div>

                <div class="d-flex flex-column flex-lg-row justify-content-between mb-3 gap-2">
                    <button class="btn btn-outline-primary btn-icon flex-fill me-2 rounded-5">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg"
                            alt="Google" width="20" height="20" /> Google
                    </button>
                    <button class="btn btn-outline-primary btn-icon flex-fill me-2 rounded-5">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg"
                            alt="Apple" /> Apple
                    </button>
                    <button class="btn btn-outline-primary btn-icon flex-fill rounded-5">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/0/05/Facebook_Logo_%282019%29.png"
                            alt="Facebook" /> Facebook
                    </button>
                </div>

                <p class="text-muted text-center">
                    <span data-translate="have_account">Alredy have an account?</span>
                    <a href="login.html" class="text-decoration-none text-primary fw-bold"
                        data-translate="login">Login</a>
                </p>
            </div>
        </div>
    </section>

    <script src="/assets/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/js/form.js"></script>
    <script src="/assets/js/lang.js"></script>
</body>

</html>
