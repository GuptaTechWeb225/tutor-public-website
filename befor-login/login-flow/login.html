<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/assets/images/fav.png">
    <title data-translate="login_page_title">Student Login</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="/assets/css/style.css" />
</head>

<body>

    <div class="container">
        <div class="row min-vh-100 d-flex justify-content-center align-items-center ">
            <div class="col-lg-6 col-md-8 col-sm-10 ">
                <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                    <div class="row g-0">

                        <!-- LOGIN AREA -->
                        <div class="">
                            <div class="p-4 p-lg-5">

                                <h3 class="fw-bold mb-1">Welcome back !</h3>
                                <p class="text-muted mb-4">
                                    Continue your learning journey with expert mentors.
                                    <br>
                                    <a href="#" class="fw-semibold text-primary text-decoration-none">
                                        Create a student account
                                    </a>
                                </p>

                                <!-- SOCIAL LOGIN -->
                                <div class="row g-2 mb-4">
                                    <div class="col">

                                        <button
                                            class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center gap-2 ">
                                            <img src="/assets/images/svg/google.svg" width="16" alt="">
                                            <span>Google</span>
                                        </button>
                                    </div>

                                    <div class="col">
                                        <button
                                            class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center gap-2 ">
                                            <img src="/assets/images/svg/apple.svg" width="16" alt="">
                                            <span>Apple</span>
                                        </button>
                                    </div>
 
                                    <div class="col">
                                        <button
                                            class="btn btn-outline-primary w-100 d-flex align-items-center justify-content-center gap-2 ">
                                            <!-- Facebook -->
                                            <img src="/assets/images/svg/facebook.svg" width="16" alt="">
                                            <span>Facebook</span>
                                        </button>
                                    </div>
                                </div>

                                <div class="text-center  my-4">
                                    <small>or sign in using your credentials</small>
                                </div>

                                <!-- FORM -->
                                <div class="mb-3">
                                    <label class="form-label fw-semibold">Email address</label>
                                    <input type="email" name="email" class="form-control form-control-lg"
                                        placeholder="student@email.com" required>
                                </div>

                                <div class="mb-4">
                                    <label class="form-label fw-semibold">Password</label>
                                    <input type="password" name="password" class="form-control form-control-lg"
                                        placeholder="Enter password" required>
                                </div>

                                <a href="/index.html" type="submit" class="btn btn-primary btn-sm w-100 rounded-3">
                                    Continue Learning →
                                </a>

                                <div class="text-center mt-4">
                                    <span class="small text-muted">
                                        Don’t have an account?
                                    </span>
                                    <a href="/befor-login/login-flow/Signup.html"
                                        class="small fw-semibold text-primary text-decoration-none ms-1">
                                        Sign up
                                    </a>
                                </div>

                                <div class="text-center mt-3">
                                    <a href="/befor-login/login-flow/forgotpw.html" class="small ">
                                        Forgot password?
                                    </a>
                                </div>

                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>


    <script src="/assets/js/bootstrap.bundle.min.js"></script>
</body>

</html>
