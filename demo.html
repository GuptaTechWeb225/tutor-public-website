<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Navbar</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Compiled CSS from SCSS -->
  <link rel="stylesheet" href="assets/css/navbar.css">
</head>

<body>

<header>
  <nav class="navbar navbar-expand-xl navbar-light py-2 px-3">

    <!-- Logo -->
    <a class="navbar-brand d-flex align-items-center gap-2" href="#">
      <img src="assets/images/logo.svg" alt="logo" class="logo">
    </a>

    <!-- Right Section (Always Visible) -->
    <div class="d-flex align-items-center gap-2 ms-auto order-xl-3">

      <!-- Language -->
      <div class="dropdown">
        <button
          class="btn btn-sm border-0 fw-semibold text-dark dropdown-toggle"
          type="button"
          data-bs-toggle="dropdown">
          <img src="/assets/images/form/english.png" width="15" alt=""> EN
        </button>

        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#">EN</a></li>
          <li><a class="dropdown-item" href="#">AR</a></li>
        </ul>
      </div>

      <a href="#" class="nav-link px-2">Login</a>

      <a href="#" class="btn btn-outline-secondary btn-sm px-3">
        Sign up
      </a>

      <!-- Toggler -->
      <button
        class="navbar-toggler ms-2"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>

    <!-- Menu -->
    <div class="collapse navbar-collapse order-xl-2" id="mainNavbar">
      <ul class="navbar-nav mx-auto gap-xl-3">

        <li class="nav-item">
          <a class="nav-link active" href="#">Home</a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            Find a Tutor
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Math</a></li>
            <li><a class="dropdown-item" href="#">Science</a></li>
            <li><a class="dropdown-item" href="#">Programming</a></li>
          </ul>
        </li>

        <li class="nav-item">
          <a class="nav-link" href="#">How It Works</a>
        </li>

        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
            Resources
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Blogs</a></li>
            <li><a class="dropdown-item" href="#">Guides</a></li>
            <li><a class="dropdown-item" href="#">FAQs</a></li>
          </ul>
        </li>

        <li class="nav-item"><a class="nav-link" href="#">Become a Tutor</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About Us</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Careers</a></li>

      </ul>
    </div>

  </nav>
</header>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
